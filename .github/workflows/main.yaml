name: main

on:
  merge_group:
  push:
    branches:
      - "**"
      # merge_group already runs the queue; a push run on its branch would repeat every job.
      - "!gh-readonly-queue/**"
    tags-ignore:
      - "**"

jobs:
  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.70.0
        id: setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Fetch from LFS only the PNG sources that the image check reads.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: packages/images/raw/*/exports/*.png
        with:
          token: ${{ steps.setup.outputs.token }}
          clean: false
          lfs: true
          persist-credentials: false
      - name: Materialize LFS sources
        run: git lfs checkout
      - name: Run lint
        run: pnpm run lint:ci

  # The only semgrep ruleset targets Go services, so this library runs none.
  lint-semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-semgrep@v1.70.0
        with:
          ruleset: none
          # renovate: datasource=docker depName=semgrep/semgrep
          version: "1.182.0"

  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.70.0
        with:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          version: "8.30.1"

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.70.0
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.31.1"

  test-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.70.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_action: "test:unit"

  # Component tests, then the Storybook stories, which compare their screenshots against the Drive
  # reference batch once the VISUAL_* variables are set.
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # renovate: datasource=npm depName=playwright
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
      statuses: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-playwright@v1.70.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          component_test_action: "test:browser"
          coverage_artifact: coverage-browser
          coverage_file: coverage/lcov.info
          test_action: "test:storybook"
          runner: vitest
          drive_ci_provider: ${{ vars.VISUAL_CI_PROVIDER }}
          drive_ci_account: ${{ vars.VISUAL_CI_ACCOUNT }}
          drive_maintenance_provider: ${{ vars.VISUAL_MAINTENANCE_PROVIDER }}
          drive_maintenance_account: ${{ vars.VISUAL_MAINTENANCE_ACCOUNT }}
          references_folder: ${{ vars.VISUAL_REFERENCES_FOLDER }}
          results_folder: ${{ vars.VISUAL_RESULTS_FOLDER }}
          seed_sha: ${{ vars.VISUAL_SEED_SHA }}

  # The required check over both suites. It fails unless each one succeeded, so a
  # skipped or cancelled suite blocks the merge.
  test-js:
    needs: [test-unit, test-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every test suite
        env:
          UNIT_RESULT: ${{ needs.test-unit.result }}
          BROWSER_RESULT: ${{ needs.test-browser.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success

  report-codecov:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-browser
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.70.0
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.70.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_action: "build:ci"
