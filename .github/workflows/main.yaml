name: main

on:
  merge_group:
  push:
    branches:
      - "**"
      # merge_group already runs the queue; a push run on its branch would repeat every job.
      - "!gh-readonly-queue/**"
    tags-ignore:
      - "**"

jobs:
  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.62.0
        id: setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        # Fetch from LFS only the PNG sources that the image check reads.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: packages/images/raw/*/exports/*.png
        with:
          token: ${{ steps.setup.outputs.token }}
          clean: false
          lfs: true
          persist-credentials: false
      - name: Materialize LFS sources
        run: git lfs checkout
      - name: Run lint
        run: pnpm run lint:ci

  test-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.62.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_action: "test:unit"

  test-browser:
    runs-on: ubuntu-latest
    container:
      # renovate: datasource=npm depName=playwright
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.62.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_action: "test:browser"
          coverage_artifact: coverage-browser

  test-storybook:
    runs-on: ubuntu-latest
    container:
      # renovate: datasource=npm depName=playwright
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.62.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Storybook interaction and accessibility tests
        run: pnpm run test:storybook

  # Keep the established required context while making it fail closed over
  # every independently visible test suite.
  test-js:
    needs: [test-unit, test-browser, test-storybook]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every test suite
        env:
          UNIT_RESULT: ${{ needs.test-unit.result }}
          BROWSER_RESULT: ${{ needs.test-browser.result }}
          STORYBOOK_RESULT: ${{ needs.test-storybook.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$STORYBOOK_RESULT" = success

  report-codecov:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-browser
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.62.0
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.62.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_action: "build:ci"
