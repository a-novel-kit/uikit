name: main

on:
  merge_group:
  push:
    branches:
      - "**"
      # merge_group already runs the queue; a push run on its branch would repeat every job.
      - "!gh-readonly-queue/**"
    tags-ignore:
      - "**"

jobs:
  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_action: lint:ci

  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.87.1

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.87.1

  test-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_action: "test:unit"

  # Component tests, then the Storybook stories, which compare their screenshots against the Drive
  # reference batch once the VISUAL_* variables are set.
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # renovate: datasource=npm depName=playwright
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
      statuses: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/node-actions/test-playwright@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          component_test_action: "test:browser"
          coverage_artifact: coverage-browser
          coverage_file: coverage/lcov.info
          test_action: "test:storybook"
          runner: vitest
          drive_ci_provider: ${{ vars.VISUAL_CI_PROVIDER }}
          drive_ci_account: ${{ vars.VISUAL_CI_ACCOUNT }}
          drive_maintenance_provider: ${{ vars.VISUAL_MAINTENANCE_PROVIDER }}
          drive_maintenance_account: ${{ vars.VISUAL_MAINTENANCE_ACCOUNT }}
          references_folder: ${{ vars.VISUAL_REFERENCES_FOLDER }}
          results_folder: ${{ vars.VISUAL_RESULTS_FOLDER }}
          seed_sha: ${{ vars.VISUAL_SEED_SHA }}

  # The required check over both suites. It fails unless each one succeeded, so a
  # skipped or cancelled suite blocks the merge.
  report-codecov:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-browser
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.87.1
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_action: "build:ci"
